name: Bug report
description: Report a bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug description
      placeholder: Describe the bug in as much detail as you can. You can also attach screenshots and videos...
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version of the plugin you're running. If you use the source code version, specify the commit hash or the approximate date of downloading
      placeholder: ex. "1.1-alpha", "Source d437d64", "Source around 2026-09-13"  
    validations:
      required: true

  - type: textarea
    id: other-plugins
    attributes:
      label: Other plugins
      description: Other plugins you use and their pages. Leave it empty if you don't use any.
      placeholder: |
                  - Godot Epic Tool addon: https://github.com/SomePluginAuthor/GodotEpicToolAddon
                  - Some another plugin: https://store.godotengine.org/asset/somebodysomeone/some-another-plugin/
    validations:
      required: false
      
  - type: input
    id: godot-version
    attributes:
      label: Godot version
      description: The version of Godot you're running
      placeholder: ex. v4.4.1.stable.arch_linux
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Your OS
      placeholder: ex. Windows 11, Arch Linux, Android
    validations:
      required: true
            
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I read the [troubleshooting page](https://github.com/Wolfyxon/GodotTogether/wiki/Troubleshooting)
          required: true
        - label: I searched for other issues describing this bug (closed and open)
          required: true
        - label: The bug isn't listed in the [TODO list](https://github.com/Wolfyxon/GodotTogether/issues/1) and the feature it's referring to is implemented
          required: true
